<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Portal & Admin Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--error); }

        .msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .msg.success { color: var(--success); }
        .msg.error { color: var(--error); }

        .hidden { display: none !important; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th { background-color: #f1f5f9; font-weight: 600; }

        .stats {
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌐 Cloud Connected Web Portal</h2>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('register')">Register</button>
            <button class="tab-btn" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('admin')">Admin Panel</button>
        </div>

        <!-- 1. REGISTER SECTION -->
        <div id="section-register" class="auth-section">
            <h3>Create an Account</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Create a secure password">
            </div>
            <button class="btn" onclick="registerUser()">Register to Cloud DB</button>
            <div id="reg-msg" class="msg"></div>
        </div>

        <!-- 2. LOGIN SECTION -->
        <div id="section-login" class="auth-section hidden">
            <h3>Welcome Back</h3>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter your password">
            </div>
            <button class="btn" onclick="loginUser()">Log In</button>
            <div id="login-msg" class="msg"></div>
        </div>

        <!-- 3. USER DASHBOARD SECTION -->
        <div id="section-dashboard" class="auth-section hidden">
            <h3>User Dashboard</h3>
            <p>Hello, <span id="user-display-name" style="font-weight: bold; color: var(--primary);"></span>!</p>
            <p>You are logged into the live global cloud database.</p>
            <button class="btn btn-danger" onclick="logoutUser()">Log Out</button>
        </div>

        <!-- 4. ADMIN PANEL SECTION -->
        <div id="section-admin" class="auth-section hidden">
            <h3>Cloud Database Accounts</h3>
            <div class="stats">
                <span>Total Live Accounts: <span id="total-users">0</span></span>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Joined Date</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-table">
                        <!-- Loaded live from Firebase -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "firebase/analytics";

        // REPLACE THIS WITH YOUR FIREBASE CONFIG FROM STEP 1
        const firebaseConfig = {
            apiKey: "AIzaSyDfR1qBZbTi9HnHJ97T_AM1Mc4yyuPLwUU",
            authDomain: "ozeff-c8c89.firebaseapp.com",
            projectId: "ozeff-c8c89",
            storageBucket: "ozeff-c8c89.firebasestorage.app",
            messagingSenderId: "1056272024415",
            appId: "1:1056272024415:web:55a0bf7999fcd58ae2acea"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Expose functions globally for UI buttons
        window.registerUser = async function() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const msgEl = document.getElementById('reg-msg');

            if (!name || !email || !password) {
                msgEl.textContent = "Please fill in all fields.";
                msgEl.className = "msg error";
                return;
            }

            msgEl.textContent = "Saving to Cloud Database...";
            msgEl.className = "msg";

            try {
                // Check if user already exists
                const q = query(collection(db, "users"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    msgEl.textContent = "An account with this email already exists!";
                    msgEl.className = "msg error";
                    return;
                }

                // Add to Cloud Database
                await addDoc(collection(db, "users"), {
                    name: name,
                    email: email,
                    password: password,
                    joined: new Date().toLocaleDateString()
                });

                msgEl.textContent = "Registration successful! Saved to Cloud Database.";
                msgEl.className = "msg success";

                document.getElementById('reg-name').value = '';
                document.getElementById('reg-email').value = '';
                document.getElementById('reg-password').value = '';
            } catch (e) {
                msgEl.textContent = "Error saving data: " + e.message;
                msgEl.className = "msg error";
            }
        };

        window.loginUser = async function() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const msgEl = document.getElementById('login-msg');

            msgEl.textContent = "Verifying credentials...";
            msgEl.className = "msg";

            try {
                const q = query(collection(db, "users"), where("email", "==", email), where("password", "==", password));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    msgEl.textContent = "Invalid email or password.";
                    msgEl.className = "msg error";
                    return;
                }

                const userData = querySnapshot.docs[0].data();
                sessionStorage.setItem('active_user', JSON.stringify(userData));

                msgEl.textContent = "Login successful!";
                msgEl.className = "msg success";

                setTimeout(() => {
                    document.getElementById('section-login').classList.add('hidden');
                    document.getElementById('section-dashboard').classList.remove('hidden');
                    document.getElementById('user-display-name').textContent = userData.name;
                }, 500);
            } catch (e) {
                msgEl.textContent = "Login error: " + e.message;
                msgEl.className = "msg error";
            }
        };

        window.loadAdminTable = async function() {
            const tbody = document.getElementById('admin-user-table');
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Loading from cloud...</td></tr>`;

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                document.getElementById('total-users').textContent = querySnapshot.size;

                tbody.innerHTML = '';
                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-light);">No accounts found in cloud database.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const u = doc.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(u.name)}</td>
                        <td>${escapeHtml(u.email)}</td>
                        <td>${u.joined}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--error);">Error loading data: ${e.message}</td></tr>`;
            }
        };

        window.logoutUser = function() {
            sessionStorage.removeItem('active_user');
            document.getElementById('section-dashboard').classList.add('hidden');
            document.getElementById('section-login').classList.remove('hidden');
        };

        window.switchTab = function(tabName) {
            document.querySelectorAll('.auth-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'register') {
                document.getElementById('section-register').classList.remove('hidden');
                event.target.classList.add('active');
            } else if (tabName === 'login') {
                const active = sessionStorage.getItem('active_user');
                if (active) {
                    const user = JSON.parse(active);
                    document.getElementById('section-dashboard').classList.remove('hidden');
                    document.getElementById('user-display-name').textContent = user.name;
                } else {
                    document.getElementById('section-login').classList.remove('hidden');
                }
                event.target.classList.add('active');
            } else if (tabName === 'admin') {
                document.getElementById('section-admin').classList.remove('hidden');
                event.target.classList.add('active');
                window.loadAdminTable();
            }
        };

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
