<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Portal & Admin Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--error);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .msg.success { color: var(--success); }
        .msg.error { color: var(--error); }

        .hidden {
            display: none !important;
        }

        /* Admin Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 My Web Portal</h2>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('register')">Register</button>
            <button class="tab-btn" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('admin')">Admin Panel</button>
        </div>

        <!-- 1. REGISTER SECTION -->
        <div id="section-register" class="auth-section">
            <h3>Create an Account</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Create a secure password">
            </div>
            <button class="btn" onclick="registerUser()">Register Account</button>
            <div id="reg-msg" class="msg"></div>
        </div>

        <!-- 2. LOGIN SECTION -->
        <div id="section-login" class="auth-section hidden">
            <h3>Welcome Back</h3>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter your password">
            </div>
            <button class="btn" onclick="loginUser()">Log In</button>
            <div id="login-msg" class="msg"></div>
        </div>

        <!-- 3. DASHBOARD SECTION (User View) -->
        <div id="section-dashboard" class="auth-section hidden">
            <h3>User Dashboard</h3>
            <p>Hello, <span id="user-display-name" style="font-weight: bold; color: var(--primary);"></span>!</p>
            <p>You are successfully logged into your account.</p>
            <button class="btn btn-danger" onclick="logoutUser()">Log Out</button>
        </div>

        <!-- 4. ADMIN PANEL SECTION (Admin View) -->
        <div id="section-admin" class="auth-section hidden">
            <h3>Database & Account Manager</h3>
            <div class="stats">
                <span>Total Registered Accounts: <span id="total-users">0</span></span>
                <button onclick="clearDatabase()" style="background: none; border: none; color: var(--error); cursor: pointer; font-weight: bold;">Clear Database</button>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Joined Date</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-table">
                        <!-- Populated dynamically via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript (Front-End Logic & Database Handler) -->
    <script>
        // Initialize or load user database from browser LocalStorage (acts as our lightweight database model)
        function getUsersDB() {
            const data = localStorage.getItem('my_website_users');
            return data ? JSON.parse(data) : [];
        }

        function saveUsersDB(users) {
            localStorage.setItem('my_website_users', JSON.stringify(users));
        }

        function getSession() {
            const session = localStorage.getItem('my_website_session');
            return session ? JSON.parse(session) : null;
        }

        function saveSession(user) {
            localStorage.setItem('my_website_session', JSON.stringify(user));
        }

        function clearSession() {
            localStorage.removeItem('my_website_session');
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.auth-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'register') {
                document.getElementById('section-register').classList.remove('hidden');
                event.target.classList.add('active');
            } else if (tabName === 'login') {
                const session = getSession();
                if (session) {
                    // If already logged in, show dashboard instead
                    document.getElementById('section-dashboard').classList.remove('hidden');
                    document.getElementById('user-display-name').textContent = session.name;
                } else {
                    document.getElementById('section-login').classList.remove('hidden');
                }
                event.target.classList.add('active');
            } else if (tabName === 'admin') {
                document.getElementById('section-admin').classList.remove('hidden');
                event.target.classList.add('active');
                loadAdminTable();
            }
        }

        // Register Function
        function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const msgEl = document.getElementById('reg-msg');

            if (!name || !email || !password) {
                msgEl.textContent = "Please fill in all fields.";
                msgEl.className = "msg error";
                return;
            }

            let users = getUsersDB();
            const existing = users.find(u => u.email === email);
            if (existing) {
                msgEl.textContent = "An account with this email already exists!";
                msgEl.className = "msg error";
                return;
            }

            const newUser = {
                name: name,
                email: email,
                password: password,
                joined: new Date().toLocaleDateString()
            };

            users.push(newUser);
            saveUsersDB(users);

            msgEl.textContent = "Registration successful! You can now log in.";
            msgEl.className = "msg success";

            // Clear inputs
            document.getElementById('reg-name').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-password').value = '';
        }

        // Login Function
        function loginUser() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const msgEl = document.getElementById('login-msg');

            let users = getUsersDB();
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                msgEl.textContent = "Invalid email or password.";
                msgEl.className = "msg error";
                return;
            }

            saveSession(user);
            msgEl.textContent = "Login successful!";
            msgEl.className = "msg success";

            setTimeout(() => {
                document.getElementById('section-login').classList.add('hidden');
                document.getElementById('section-dashboard').classList.remove('hidden');
                document.getElementById('user-display-name').textContent = user.name;
            }, 500);
        }

        // Logout Function
        function logoutUser() {
            clearSession();
            document.getElementById('section-dashboard').classList.add('hidden');
            document.getElementById('section-login').classList.remove('hidden');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-msg').textContent = '';
        }

        // Admin Table Loader
        function loadAdminTable() {
            const users = getUsersDB();
            const tbody = document.getElementById('admin-user-table');
            document.getElementById('total-users').textContent = users.length;

            tbody.innerHTML = '';
            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-light);">No registered accounts found yet.</td></tr>`;
                return;
            }

            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(u.name)}</td>
                    <td>${escapeHtml(u.email)}</td>
                    <td>${u.joined}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearDatabase() {
            if (confirm("Are you sure you want to clear all user accounts?")) {
                localStorage.removeItem('my_website_users');
                localStorage.removeItem('my_website_session');
                loadAdminTable();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
